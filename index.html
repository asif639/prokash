
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>প্রকাশ | Prokash</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f4f2;
      color: #183b2b;
    }
    header {
      background: #176b4d;
      color: white;
      text-align: center;
      padding: 24px 16px;
    }
    header h1 { margin: 0 0 8px; }
    main {
      max-width: 420px;
      margin: 28px auto;
      padding: 20px;
    }
    .panel {
      background: white;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 4px 18px #00000010;
    }
    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 9px;
      font-size: 16px;
    }
    input {
      border: 1px solid #cbd8d0;
      background: white;
    }
    button {
      border: 0;
      background: #176b4d;
      color: white;
      font-weight: bold;
    }
    button.secondary {
      background: #e6eee9;
      color: #176b4d;
    }
    #message {
      line-height: 1.7;
      overflow-wrap: anywhere;
    }
    .hidden { display: none; }
    small { color: #63776b; line-height: 1.6; }
  </style>
</head>
<body>
  <header>
    <h1>প্রকাশ</h1>
    <div>আপনার কথা, আপনার পরিচয়</div>
  </header>

  <main>
    <section class="panel" id="authPanel">
      <h2>স্বাগতম!</h2>
      <p>নতুন অ্যাকাউন্ট তৈরি করুন অথবা লগইন করুন।</p>

      <input id="email" type="email"
        placeholder="আপনার ইমেইল" autocomplete="email">

      <input id="password" type="password"
        placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)"
        autocomplete="current-password">

      <button id="signupBtn">নতুন অ্যাকাউন্ট তৈরি</button>
      <button id="loginBtn" class="secondary">লগইন</button>

      <p id="message" role="status"></p>
      <small>
        অ্যাকাউন্ট তৈরি করতে বৈধ ইমেইল ব্যবহার করুন।
        ইমেইল যাচাই চালু থাকলে যাচাই সম্পন্ন করতে হবে।
      </small>
    </section>

    <section class="panel hidden" id="homePanel">
      <h2>প্রকাশে স্বাগতম!</h2>
      <p>আপনি লগইন করেছেন।</p>
      <p id="userEmail"></p>
      <p>চ্যাটের সুবিধা পরবর্তী ধাপে যোগ করা হবে।</p>
      <button id="logoutBtn">লগআউট</button>
      <p id="homeMessage" role="status"></p>
    </section>
  </main>

  <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL =
      'https://evhywnompdttjozbafvt.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_rnrZ4bAeS6-jT3EpRZTzrg_WerzM3-s';

    const supabase = createClient(
      SUPABASE_URL, SUPABASE_KEY
    );

    const authPanel = document.getElementById('authPanel');
    const homePanel = document.getElementById('homePanel');
    const message = document.getElementById('message');

    function showMessage(text) {
      message.textContent = text;
    }

    function showHome(user) {
      authPanel.classList.add('hidden');
      homePanel.classList.remove('hidden');
      document.getElementById('userEmail').textContent =
        user.email || '';
    }

    function showAuth() {
      homePanel.classList.add('hidden');
      authPanel.classList.remove('hidden');
    }

    document.getElementById('signupBtn').onclick = async () => {
      const email = document.getElementById('email')
        .value.trim();
      const password = document.getElementById('password')
        .value;

      if (!email || password.length < 6) {
        showMessage('সঠিক ইমেইল ও কমপক্ষে ৬ অক্ষরের পাসওয়ার্ড দিন।');
        return;
      }

      showMessage('অ্যাকাউন্ট তৈরি হচ্ছে...');

      const { data, error } = await supabase.auth.signUp({
        email,
        password
      });

      if (error) {
        showMessage('সমস্যা: ' + error.message);
        return;
      }

      if (data.session && data.user) {
        showHome(data.user);
      } else {
        showMessage(
          'অ্যাকাউন্ট তৈরি হয়েছে। ইমেইল যাচাই প্রয়োজন হলে যাচাই করে তারপর লগইন করুন।'
        );
      }
    };

    document.getElementById('loginBtn').onclick = async () => {
      const email = document.getElementById('email')
        .value.trim();
      const password = document.getElementById('password')
        .value;

      if (!email || !password) {
        showMessage('ইমেইল ও পাসওয়ার্ড দিন।');
        return;
      }

      showMessage('লগইন হচ্ছে...');

      const { data, error } =
        await supabase.auth.signInWithPassword({
          email,
          password
        });

      if (error) {
        showMessage('লগইন হয়নি: ' + error.message);
        return;
      }

      showHome(data.user);
    };

    document.getElementById('logoutBtn').onclick = async () => {
      const { error } = await supabase.auth.signOut();

      if (error) {
        document.getElementById('homeMessage').textContent =
          'লগআউট হয়নি: ' + error.message;
        return;
      }

      showAuth();
      showMessage('লগআউট হয়েছে।');
    };

    const { data } = await supabase.auth.getSession();

    if (data.session) {
      showHome(data.session.user);
    }
  </script>
</body>
</html>
